<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rolling Fiefdoms online version." />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rolling Fiefdoms Web Prototype</title>
  <link rel="modulepreload" href="app/app.js?v=v1" />
  <link rel="icon" type="image/svg+xml" href="assets/img/forfeit.svg" />
  <link rel="preload" href="assets/css/fonts.css" as="style" />
  <link rel="preload" href="assets/css/styles.css" as="style" />
  <link rel="preload" href="resources/rolling-fiefdoms-player-sheet.webp?v=v1.3" as="image" fetchpriority="high" />
  <link rel="preload" href="assets/img/rules.webp" as="image" />
  <link rel="preload" href="assets/img/playersheet.webp" as="image" />
  <link rel="preload" href="assets/img/github.webp" as="image" />
  <link rel="preload" href="assets/img/fullscreen.webp" as="image" />
  <link rel="preload" href="assets/img/bgg.webp" as="image" />
  <link rel="stylesheet" href="assets/css/fonts.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="assets/css/styles.css" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </noscript>
</head>
<body class="loading">
  <header>
    <h1>Rolling Fiefdoms</h1>
    <nav class="top-menu" aria-label="Quick links">
      <a class="menu-item" href="resources/rolling-fiefdoms-rulebook.pdf" target="_blank" rel="noopener">
        <span class="menu-icon"><img src="assets/img/rules.webp" alt="" loading="lazy" decoding="async" width="32" height="32" /></span>
        <span class="menu-text">Rules</span>
      </a>
      <a class="menu-item" href="https://drive.google.com/drive/folders/1LZZwRlzmxAoZXZu0cfslqcEjHGrQazP7" target="_blank" rel="noopener">
        <span class="menu-icon"><img src="assets/img/playersheet.webp" alt="" loading="lazy" decoding="async" width="32" height="32" /></span>
        <span class="menu-text">Download</span>
      </a>
      <a
        class="menu-item"
        href="https://boardgamegeek.com/thread/3596654/wip-rolling-fiefdoms-2025-roll-and-write-contest"
        target="_blank"
        rel="noopener"
      >
        <span class="menu-icon"><img src="assets/img/bgg.webp" alt="" loading="lazy" decoding="async" width="32" height="32" /></span>
        <span class="menu-text">BGG</span>
      </a>
      <a class="menu-item" href="https://github.com/edno/pnp-rolling-fiefdoms" target="_blank" rel="noopener">
        <span class="menu-icon"><img src="assets/img/github.webp" alt="" loading="lazy" decoding="async" width="32" height="32" /></span>
        <span class="menu-text">Github</span>
      </a>
      <button class="menu-item" id="fullscreenToggle" type="button">
        <span class="menu-icon"><img src="assets/img/fullscreen.webp" alt="" loading="lazy" decoding="async" width="32" height="32" /></span>
        <span class="menu-text">Fullscreen</span>
      </button>
      <button class="menu-item" id="themeToggle" type="button" aria-pressed="false">
        <span class="menu-icon"><img id="themeToggleIcon" src="assets/img/sun.svg" alt="" decoding="async" width="32" height="32" /></span>
        <span class="menu-text" id="themeToggleText">Light</span>
      </button>
    </nav>
  </header>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text">Loading board…</div>
  </div>
  <div id="actionBanner" class="action-banner" aria-live="polite"></div>

  <main>
    <section class="board-panel">
      <div class="sheet" id="sheet">
        <img
          id="sheetBaseImage"
          class="sheet-base"
          src="resources/rolling-fiefdoms-player-sheet.webp?v=v1.3"
          alt=""
          fetchpriority="high"
          decoding="async"
          width="1086"
          height="767"
        />
        <div class="fiefdom-overlay">
          <input id="fiefdomInput" type="text" maxlength="20" placeholder="Fiefdom name" />
        </div>
        <div id="regionOverlay" class="region-overlay"></div>
        <div class="board" id="board"></div>
        <div id="scoreOverlay" class="score-overlay"></div>
        <div id="popHousingOverlay" class="pop-housing-overlay"></div>
        <div id="buildingsOverlay" class="buildings-overlay" aria-label="Select building"></div>
        <div id="guildsOverlay" class="guilds-overlay" aria-label="Select guild"></div>
      </div>
    </section>

    <section class="controls">
      <div class="panel">
        <h2>Turn <span id="turnStatusChip" class="status-chip" aria-live="polite"></span></h2>
        <button id="rollBtn">Roll Dice</button>
        <div id="diceView"></div>
        <div id="turnHint" class="hint"></div>
        <button id="finishActivation" style="display:none;">Finish Activation</button>
        <button id="newGameBtn" style="display:none;">Play again</button>
      </div>

      <div class="panel">
        <h2>Split & Build</h2>
        <div class="field">
          <label>Location Dice</label>
          <div class="dice-row" id="locDicePreview"></div>
        </div>
        <div class="field">
          <label>Build Dice</label>
          <div class="dice-row" id="buildDicePreview"></div>
        </div>
      </div>

      <div class="panel log-panel">
        <h2>Log</h2>
        <div class="log-body">
          <ul id="log"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-title">Rolling Fiefdoms helper</span>
      <span class="footer-sep">·</span>
      <span>Code: <a href="LICENSE">MIT</a></span>
      <span class="footer-sep">·</span>
      <span>Assets: <a href="LICENSE-ASSETS">CC BY-NC-SA 4.0</a></span>
      <span class="footer-sep">·</span>
      <span>&copy; 2025 Gregory Heitz</span>
    </div>
  </footer>

  <script type="module" src="app/app.js?v=v1"></script>
</body>
</html>
